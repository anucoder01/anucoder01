<svg width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card 1: Calibr -->
  <g transform="translate(10,10)">
    <rect width="185" height="210" rx="14" fill="#0d1117" stroke="#58A6FF" stroke-width="2" filter="url(#card-glow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="24" cy="30" r="10" fill="#58A6FF" opacity="0.15"/>
    <text x="24" y="35" text-anchor="middle" font-size="13" fill="#58A6FF">⚛</text>
    <text x="18" y="62" font-family="Segoe UI, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#F5F3FF">Calibr</text>
    <text x="18" y="85" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#8b949e">AI Fairness &amp;</text>
    <text x="18" y="100" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#8b949e">Model Monitoring</text>
    <text x="18" y="130" font-family="Consolas, monospace" font-size="10" fill="#58A6FF">React 19 · TS</text>
    <text x="18" y="146" font-family="Consolas, monospace" font-size="10" fill="#58A6FF">Recharts · Vega</text>
    <rect x="18" y="175" width="149" height="1" fill="#30363d"/>
    <text x="18" y="196" font-family="Segoe UI, Helvetica, sans-serif" font-size="10" fill="#c9d1d9">Lead Developer</text>
  </g>

  <!-- Card 2: Aven -->
  <g transform="translate(205,10)">
    <rect width="185" height="210" rx="14" fill="#0d1117" stroke="#8B5CF6" stroke-width="2" filter="url(#card-glow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </rect>
    <circle cx="24" cy="30" r="10" fill="#8B5CF6" opacity="0.15"/>
    <text x="24" y="35" text-anchor="middle" font-size="13" fill="#8B5CF6">🧠</text>
    <text x="18" y="62" font-family="Segoe UI, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#F5F3FF">Aven</text>
    <text x="18" y="85" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#8b949e">Clinical-Grade AI</text>
    <text x="18" y="100" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#8b949e">CBT Simulator</text>
    <text x="18" y="130" font-family="Consolas, monospace" font-size="10" fill="#8B5CF6">PyTorch</text>
    <text x="18" y="146" font-family="Consolas, monospace" font-size="10" fill="#8B5CF6">RoBERTa · FastAPI</text>
    <rect x="18" y="175" width="149" height="1" fill="#30363d"/>
    <text x="18" y="196" font-family="Segoe UI, Helvetica, sans-serif" font-size="10" fill="#c9d1d9">Lead Developer</text>
  </g>

  <!-- Card 3: InfraPredict -->
  <g transform="translate(400,10)">
    <rect width="185" height="210" rx="14" fill="#0d1117" stroke="#58A6FF" stroke-width="2" filter="url(#card-glow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="24" cy="30" r="10" fill="#58A6FF" opacity="0.15"/>
    <text x="24" y="35" text-anchor="middle" font-size="13" fill="#58A6FF">☁</text>
    <text x="18" y="62" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F5F3FF">InfraPredict</text>
    <text x="18" y="85" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#8b949e">Predictive IoT</text>
    <text x="18" y="100" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#8b949e">Infra Monitoring</text>
    <text x="18" y="130" font-family="Consolas, monospace" font-size="10" fill="#58A6FF">Next.js · GCP</text>
    <text x="18" y="146" font-family="Consolas, monospace" font-size="10" fill="#58A6FF">Vertex AI</text>
    <rect x="18" y="175" width="149" height="1" fill="#30363d"/>
    <text x="18" y="196" font-family="Segoe UI, Helvetica, sans-serif" font-size="10" fill="#c9d1d9">Lead Developer</text>
  </g>

  <!-- Card 4: TrustTrace -->
  <g transform="translate(595,10)">
    <rect width="195" height="210" rx="14" fill="#0d1117" stroke="#8B5CF6" stroke-width="2" filter="url(#card-glow)">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </rect>
    <circle cx="24" cy="30" r="10" fill="#8B5CF6" opacity="0.15"/>
    <text x="24" y="35" text-anchor="middle" font-size="13" fill="#8B5CF6">🔍</text>
    <text x="18" y="62" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F5F3FF">TrustTrace</text>
    <text x="18" y="85" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#8b949e">Document Fraud</text>
    <text x="18" y="100" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" fill="#8b949e">Intelligence</text>
    <text x="18" y="130" font-family="Consolas, monospace" font-size="10" fill="#8B5CF6">OpenCV · sklearn</text>
    <text x="18" y="146" font-family="Consolas, monospace" font-size="10" fill="#8B5CF6">97.8% accurate</text>
    <rect x="18" y="175" width="159" height="1" fill="#30363d"/>
    <text x="18" y="196" font-family="Segoe UI, Helvetica, sans-serif" font-size="10" fill="#c9d1d9">Lead Developer</text>
  </g>
</svg>
