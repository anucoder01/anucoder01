<svg width="700" height="230" viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="230" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Generative AI & LLMs — 92% -->
  <text x="24" y="38" fill="#c9d1d9" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Generative AI &amp; LLMs</text>
  <text x="676" y="38" text-anchor="end" fill="#58A6FF" font-family="Consolas, monospace" font-size="13">92%</text>
  <rect x="24" y="46" width="652" height="10" rx="5" fill="#21262d"/>
  <rect x="24" y="46" height="10" rx="5" fill="#58A6FF" width="0">
    <animate attributeName="width" values="0;600;600;0" keyTimes="0;0.3;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Machine Learning & MLOps — 87% -->
  <text x="24" y="88" fill="#c9d1d9" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Machine Learning &amp; MLOps</text>
  <text x="676" y="88" text-anchor="end" fill="#8B5CF6" font-family="Consolas, monospace" font-size="13">87%</text>
  <rect x="24" y="96" width="652" height="10" rx="5" fill="#21262d"/>
  <rect x="24" y="96" height="10" rx="5" fill="#8B5CF6" width="0">
    <animate attributeName="width" values="0;567;567;0" keyTimes="0;0.3;0.85;1" dur="7s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Full-Stack Development — 90% -->
  <text x="24" y="138" fill="#c9d1d9" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Full-Stack Development</text>
  <text x="676" y="138" text-anchor="end" fill="#58A6FF" font-family="Consolas, monospace" font-size="13">90%</text>
  <rect x="24" y="146" width="652" height="10" rx="5" fill="#21262d"/>
  <rect x="24" y="146" height="10" rx="5" fill="#58A6FF" width="0">
    <animate attributeName="width" values="0;587;587;0" keyTimes="0;0.3;0.85;1" dur="7s" begin="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Cloud & Infra (GCP) — 78% -->
  <text x="24" y="188" fill="#c9d1d9" font-family="Segoe UI, Helvetica, sans-serif" font-size="14">Cloud &amp; Infra (GCP)</text>
  <text x="676" y="188" text-anchor="end" fill="#8B5CF6" font-family="Consolas, monospace" font-size="13">78%</text>
  <rect x="24" y="196" width="652" height="10" rx="5" fill="#21262d"/>
  <rect x="24" y="196" height="10" rx="5" fill="#8B5CF6" width="0">
    <animate attributeName="width" values="0;509;509;0" keyTimes="0;0.3;0.85;1" dur="7s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
