<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B1F6B"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="320" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="34" fill="#8b949e" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" letter-spacing="2">AI / GENAI TECH ORBIT</text>
  <line x1="30" y1="46" x2="770" y2="46" stroke="#30363d" stroke-width="1"/>

  <!-- spokes + satellites, all rotating together -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 190" to="360 400 190" dur="26s" repeatCount="indefinite"/>

    <line x1="400" y1="190" x2="530" y2="190" stroke="#30363d" stroke-width="1"/>
    <line x1="400" y1="190" x2="465" y2="302" stroke="#30363d" stroke-width="1"/>
    <line x1="400" y1="190" x2="335" y2="302" stroke="#30363d" stroke-width="1"/>
    <line x1="400" y1="190" x2="270" y2="190" stroke="#30363d" stroke-width="1"/>
    <line x1="400" y1="190" x2="335" y2="78" stroke="#30363d" stroke-width="1"/>
    <line x1="400" y1="190" x2="465" y2="78" stroke="#30363d" stroke-width="1"/>

    <g transform="translate(530,190)">
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <circle r="30" fill="#161b22" stroke="#58A6FF" stroke-width="2"/>
        <text text-anchor="middle" dy="5" fill="#58A6FF" font-family="Consolas, monospace" font-size="12" font-weight="700">LLMs</text>
      </g>
    </g>

    <g transform="translate(465,302)">
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <circle r="30" fill="#161b22" stroke="#8B5CF6" stroke-width="2"/>
        <text text-anchor="middle" dy="5" fill="#8B5CF6" font-family="Consolas, monospace" font-size="12" font-weight="700">RAG</text>
      </g>
    </g>

    <g transform="translate(335,302)">
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <circle r="30" fill="#161b22" stroke="#58A6FF" stroke-width="2"/>
        <text text-anchor="middle" dy="-2" fill="#58A6FF" font-family="Consolas, monospace" font-size="11" font-weight="700">Vector</text>
        <text text-anchor="middle" dy="12" fill="#58A6FF" font-family="Consolas, monospace" font-size="11" font-weight="700">DB</text>
      </g>
    </g>

    <g transform="translate(270,190)">
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <circle r="30" fill="#161b22" stroke="#8B5CF6" stroke-width="2"/>
        <text text-anchor="middle" dy="5" fill="#8B5CF6" font-family="Consolas, monospace" font-size="11" font-weight="700">PyTorch</text>
      </g>
    </g>

    <g transform="translate(335,78)">
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <circle r="30" fill="#161b22" stroke="#58A6FF" stroke-width="2"/>
        <text text-anchor="middle" dy="-2" fill="#58A6FF" font-family="Consolas, monospace" font-size="10" font-weight="700">Hugging</text>
        <text text-anchor="middle" dy="12" fill="#58A6FF" font-family="Consolas, monospace" font-size="10" font-weight="700">Face</text>
      </g>
    </g>

    <g transform="translate(465,78)">
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <circle r="30" fill="#161b22" stroke="#8B5CF6" stroke-width="2"/>
        <text text-anchor="middle" dy="-2" fill="#8B5CF6" font-family="Consolas, monospace" font-size="10" font-weight="700">Vertex</text>
        <text text-anchor="middle" dy="12" fill="#8B5CF6" font-family="Consolas, monospace" font-size="10" font-weight="700">AI</text>
      </g>
    </g>
  </g>

  <!-- static central hub, drawn last so it stays on top and upright -->
  <circle cx="400" cy="190" r="52" fill="url(#hub-glow)" stroke="#F5F3FF" stroke-width="1.5">
    <animate attributeName="r" values="52;56;52" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="185" text-anchor="middle" fill="#F5F3FF" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="700">AI / GenAI</text>
  <text x="400" y="203" text-anchor="middle" fill="#F5F3FF" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="700">Systems</text>
</svg>
