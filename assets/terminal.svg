<svg width="800" height="230" viewBox="0 0 800 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="term-bg" x1="0" y1="0" x2="800" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="230" rx="10" fill="url(#term-bg)" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <rect x="0" y="0" width="800" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="800" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="400" y="21" text-anchor="middle" fill="#8b949e" font-family="Segoe UI, Helvetica, sans-serif" font-size="12">anuvuti@dev — flagship-projects — zsh</text>
  <line x1="0" y1="34" x2="800" y2="34" stroke="#30363d" stroke-width="1"/>

  <!-- dot progress indicators: exactly one quarter active at a time, hard cut -->
  <circle cx="770" cy="17" r="4" fill="#58A6FF"><animate attributeName="fill" keyTimes="0;0.25;0.5;0.75;1" values="#58A6FF;#30363d;#30363d;#30363d;#58A6FF" dur="20s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <circle cx="752" cy="17" r="4" fill="#30363d"><animate attributeName="fill" keyTimes="0;0.25;0.5;0.75;1" values="#30363d;#58A6FF;#30363d;#30363d;#30363d" dur="20s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <circle cx="734" cy="17" r="4" fill="#30363d"><animate attributeName="fill" keyTimes="0;0.5;0.52;0.75;1" values="#30363d;#30363d;#58A6FF;#30363d;#30363d" dur="20s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <circle cx="716" cy="17" r="4" fill="#30363d"><animate attributeName="fill" keyTimes="0;0.75;0.77;1" values="#30363d;#30363d;#58A6FF;#30363d" dur="20s" repeatCount="indefinite" calcMode="discrete"/></circle>

  <!-- prompt glyph -->
  <text x="18" y="65" fill="#58A6FF" font-family="Consolas, monospace" font-size="18">$</text>

  <!-- Exactly one line group visible at any instant. calcMode="discrete" guarantees a hard cut, no overlap or ghosting -->
  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.25;0.5;0.75;1" values="1;0;0;0;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="58" y="65" fill="#39FF14" font-family="Consolas, monospace" font-size="17">whoami</text>
    <text x="58" y="95" fill="#c9d1d9" font-family="Consolas, monospace" font-size="15">&gt; Anuvuti Podder — AI/ML + Full-Stack Engineer</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.25;0.5;0.75;1" values="0;1;0;0;0" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="58" y="65" fill="#39FF14" font-family="Consolas, monospace" font-size="17">ls ~/flagship-projects</text>
    <text x="58" y="95" fill="#c9d1d9" font-family="Consolas, monospace" font-size="15">Calibr  Aven  InfraPredict  TrustTrace</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.25;0.5;0.75;1" values="0;0;1;0;0" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="58" y="65" fill="#39FF14" font-family="Consolas, monospace" font-size="16">cat calibr/README.md -1</text>
    <text x="58" y="95" fill="#c9d1d9" font-family="Consolas, monospace" font-size="15">&gt; Real-time Explainable AI audit dashboards</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" keyTimes="0;0.25;0.5;0.75;1" values="0;0;0;1;0" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
    <text x="58" y="65" fill="#39FF14" font-family="Consolas, monospace" font-size="17">echo $STATUS</text>
    <text x="58" y="95" fill="#c9d1d9" font-family="Consolas, monospace" font-size="15">Lead Developer · 8+ projects shipped</text>
  </g>

  <!-- blinking cursor, positioned after the prompt with a clean gap before text -->
  <rect x="34" y="52" width="8" height="16" fill="#39FF14">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
